name: test

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  slop-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate rule index
        run: python3 scripts/validate_rule_index.py
      - name: Run slop_lint on self
        run: python3 lint/slop_lint.py .
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
